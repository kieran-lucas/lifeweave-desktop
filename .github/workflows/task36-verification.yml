name: Task 36 final integration and cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/task36-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task36-final-integration
  cancel-in-progress: false

jobs:
  integrate-clean:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Assert exact main
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "main advanced after this run started"
          }

      - name: Correct the obsolete Search selector
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/task36_phase3_apply.py")
          text = path.read_text(encoding="utf-8")
          label = '        label="search test migration call",'
          if text.count(label) != 1:
              raise SystemExit(f"expected one obsolete selector label, found {text.count(label)}")
          label_index = text.index(label)
          start = text.rfind("    text = replace(", 0, label_index)
          end = text.index("    )", label_index) + len("    )")
          if start < 0 or end <= label_index:
              raise SystemExit("could not isolate obsolete Search selector")
          new = (
              '    text = replace(\n'
              '        text,\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_all_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        label="search test setup migration authority",\n'
              '    )'
          )
          path.write_text(text[:start] + new + text[end:], encoding="utf-8", newline="\n")
          '@ | python -

      - name: Apply the existing bounded patches
        shell: pwsh
        run: |
          python scripts/task36_phase3_apply.py
          python scripts/task36_migration20_scope_fix.py
          python scripts/task36_phase3_final_fix.py

      - name: Enforce Task 37 exclusion
        shell: pwsh
        run: |
          $leaks = git grep -n -E "focus_plan_id" -- src-tauri/src/task src-tauri/src/infrastructure/sqlite/migrations.rs
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $leaks | ForEach-Object { Write-Host "::error::$_" }
            throw "Task 37 relation leaked into Task 36"
          }
          if ($code -ne 1) {
            throw "Task 37 exclusion scan failed with exit code $code"
          }
          $sql = Get-Content src-tauri/src/infrastructure/sqlite/task36_migration.rs -Raw
          if ($sql -match "ALTER TABLE (tasks|task_series)" -or $sql -match "REFERENCES (tasks|task_series)") {
            throw "Task 37 SQL leaked into migration 20"
          }
          exit 0

      - name: Format changed Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify the three previously failing paths
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked narrative::repository::tests::narrative_canvas_backup_relaunch_evidence -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked search::repository::tests::search_file_backed_smoke -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked search::repository::tests::search_perf_realistic_fixture -- --exact
          exit $LASTEXITCODE

      - name: Verify bounded diff
        shell: pwsh
        run: |
          git diff --check
          $allowedPrefixes = @(
            "src-tauri/",
            ".github/workflows/task36-verification.yml",
            "scripts/task36_phase3_apply.py",
            "scripts/task36_migration20_scope_fix.py",
            "scripts/task36_phase3_final_fix.py"
          )
          $unexpected = git diff --name-only | Where-Object {
            $path = $_
            -not ($allowedPrefixes | Where-Object { $path.StartsWith($_) })
          }
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Host "::error::Unexpected path: $_" }
            throw "Phase 3 changed paths outside its bounded scope"
          }

      - name: Remove temporary Task 36 scaffolding
        shell: pwsh
        run: |
          git rm .github/workflows/task36-verification.yml
          git rm scripts/task36_phase3_apply.py
          git rm scripts/task36_migration20_scope_fix.py
          git rm scripts/task36_phase3_final_fix.py
          git rm .gitkeep-temp
          git rm specs/026-focus-plans-core/.phase1-compiler-findings.md
          git rm specs/026-focus-plans-core/compiler-boundary.md
          git rm specs/026-focus-plans-core/phase1-exact-byte-policy.md
          git rm specs/026-focus-plans-core/phase-1-evidence.md
          git rm docs/audits/task-36-phase-1-compiler.md

      - name: Commit integrated code and cleanup
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "main advanced before final integration commit"
          }
          git add src-tauri
          git diff --cached --check
          if (git diff --cached --quiet) {
            throw "Task 36 integration produced no changes"
          }
          git config user.name "Kieran Lucas"
          git config user.email "kieranlucas.work@gmail.com"
          git commit -m "integrate task 36 search backup and remove temporary scaffolding [skip ci]"
          git push origin HEAD:main
