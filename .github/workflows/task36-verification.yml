name: Task 36 verification

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - "specs/026-focus-plans-core/**"
      - "docs/PROJECT_STATE.json"
      - "docs/STATUS.md"
      - "docs/ROADMAP.md"
      - "START_HERE.md"
      - ".github/workflows/task36-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Source integrity
        run: python scripts/verify_source_integrity.py
      - name: Repository structure
        run: python scripts/check_repository.py
      - name: Project state
        run: python scripts/check_project_state.py
      - name: Generated indexes
        run: python scripts/generate_spec_index.py --check
      - name: Remote asset policy
        run: python scripts/verify_no_remote_assets.py
      - name: Security verification
        run: python scripts/verify_security.py
      - name: Produce exact Rust diagnostics
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          New-Item -ItemType Directory -Force -Path task36-diagnostics/formatted/focus_plan | Out-Null
          New-Item -ItemType Directory -Force -Path task36-diagnostics/formatted/sqlite | Out-Null
          Copy-Item src-tauri/src/focus_plan/dto.rs task36-diagnostics/formatted/focus_plan/dto.rs
          Copy-Item src-tauri/src/focus_plan/repository.rs task36-diagnostics/formatted/focus_plan/repository.rs
          Copy-Item src-tauri/src/focus_plan/service.rs task36-diagnostics/formatted/focus_plan/service.rs
          Copy-Item src-tauri/src/infrastructure/sqlite/task36_migration.rs task36-diagnostics/formatted/sqlite/task36_migration.rs
          git diff -- src-tauri | Out-File -FilePath task36-diagnostics/rustfmt.patch -Encoding utf8
          $output = cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath task36-diagnostics/cargo-check.log | ForEach-Object { Write-Host $_ }
          Set-Content -Path task36-diagnostics/cargo-check.exit -Value $code
          if ($code -ne 0) { Write-Host "::warning::cargo check failed; exact log uploaded" }
      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: task36-rust-diagnostics
          path: task36-diagnostics
          if-no-files-found: error
      - name: Repository hardening (expected to fail until this temporary workflow is removed)
        if: always()
        run: python scripts/verify_hardening.py
