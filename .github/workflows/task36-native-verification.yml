name: Task 36 exact-SHA verification

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: task-36-exact-sha-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify projected final repository authority
        shell: powershell
        run: |
          Remove-Item -LiteralPath .github/workflows/task36-native-verification.yml -Force
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'Repository authority verification failed' }

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust and regenerate bindings
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify generated bindings and production frontend
        shell: powershell
        run: |
          git diff --exit-code -- frontend/src/ipc/generated
          if ($LASTEXITCODE -ne 0) { throw 'Generated bindings drifted after Rust tests' }
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend production build failed' }

      - name: Install native Tauri driver
        run: cargo install tauri-driver --locked

      - name: Run focused Task 36 native persistence with transcript
        shell: powershell
        run: |
          $logRoot = 'target/task36-verification'
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          $transcript = Join-Path $logRoot 'native-transcript.log'
          $failure = Join-Path $logRoot 'native-failure.txt'
          $exitCode = 0
          Start-Transcript -LiteralPath $transcript -Force
          try {
            & .\scripts\run_windows_e2e.ps1 -Phases @(
              'phase8-focus-plans.e2e.ts',
              'phase8-focus-plans-restart.e2e.ts'
            )
          } catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -LiteralPath $failure
            Write-Host $_.Exception.Message
            $exitCode = 1
          } finally {
            Stop-Transcript
          }
          exit $exitCode

      - name: Upload Task 36 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task36-exact-sha-${{ github.sha }}
          path: |
            target/task36-verification/**
            target/e2e-artifacts/**
          if-no-files-found: warn
          retention-days: 7
