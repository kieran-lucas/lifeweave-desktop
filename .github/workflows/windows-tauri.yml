name: Windows Tauri

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tauri:
    name: Windows Tauri
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup-phase notice
        if: ${{ hashFiles('pnpm-lock.yaml') == '' || hashFiles('src-tauri/Cargo.lock') == '' }}
        shell: pwsh
        run: Write-Host "Lockfiles are not present; Windows Tauri build remains non-blocking during setup."
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
        with:
          components: rustfmt, clippy
      - name: Enable pnpm
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
        shell: pwsh
        run: corepack enable
      - name: Install
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
        run: pnpm install --frozen-lockfile
      - name: Build
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
        run: pnpm --dir frontend tauri build
