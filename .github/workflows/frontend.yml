name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup-phase notice
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        run: echo "pnpm-lock.yaml is not present; run Windows bootstrap before making this check required."
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - name: Install
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm typecheck
      - name: Test
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm test
      - name: Build
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: pnpm build
