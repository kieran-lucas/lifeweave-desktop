name: Bug
description: Report a reproducible defect
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and source
      description: Cite spec/acceptance/invariant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit/version, Windows, WebView2, DPI, theme, Reduced Motion.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data risk
      options:
        - None known
        - Possible data loss/corruption
        - Confirmed data loss/corruption
        - Privacy/security
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs/screenshots
      description: Redact personal content and paths.
