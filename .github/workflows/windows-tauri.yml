name: Windows Tauri

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-tauri.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tauri:
    name: Windows Tauri
    runs-on: windows-latest
    if: ${{ hashFiles('pnpm-lock.yaml') != '' && hashFiles('src-tauri/Cargo.lock') != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --locked --all-targets -- -D warnings

      - name: Rust tests and TypeScript binding drift check
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diff = git diff --exit-code frontend/src/ipc/generated/ 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "TypeScript binding drift detected. Run 'cargo test' locally and commit the regenerated files."
            exit 1
          }

      - name: Tauri production build
        shell: pwsh
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build
