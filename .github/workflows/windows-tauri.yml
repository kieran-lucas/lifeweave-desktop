name: Windows Tauri

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tauri:
    name: Windows Tauri
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --locked --all-targets -- -D warnings

      - name: Rust tests and TypeScript binding drift check
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diff = git diff --exit-code frontend/src/ipc/generated/ 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "TypeScript binding drift detected. Run 'cargo test' locally and commit the regenerated files."
            exit 1
          }

      - name: Tauri production build
        shell: pwsh
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build

      - name: Upload unsigned internal installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifeweave-windows-unsigned-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/Lifeweave_0.0.0_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
