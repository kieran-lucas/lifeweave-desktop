name: One-time Task 36 materialization

on:
  push:
    branches: [workflow-cleanup-materialize]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize Task 36 source fixes
        run: |
          python scripts/task36_remediation.py
          python scripts/task36_revision_contract.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify focused source
        run: |
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          git diff --exit-code -- frontend/src/ipc/generated
          git diff --check

      - name: Commit bounded materialization to staging
        shell: powershell
        run: |
          Remove-Item scripts/task36_remediation.py -Force
          Remove-Item scripts/task36_revision_contract.py -Force
          Remove-Item .github/workflows/task36-materialize.yml -Force
          python scripts/check_repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Final repository governance failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Final diff check failed' }
          git config user.name "Kieran Lucas"
          git config user.email "kieranlucas.work@gmail.com"
          git add -- frontend/src/features/focus-plan/FocusPlansScreen.tsx frontend/src/features/focus-plan/FocusPlansScreen.test.tsx src-tauri/src/focus_plan/dto.rs src-tauri/src/focus_plan/repository.rs scripts/task36_remediation.py scripts/task36_revision_contract.py .github/workflows/task36-materialize.yml
          git diff --cached --name-status
          git commit -m "materialize Task 36 fixes and remove runtime patchers"
          git push origin HEAD:workflow-cleanup-materialize
