name: Task 36 integrate verified backend and cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/task36-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task36-final-integration
  cancel-in-progress: false

jobs:
  integrate-clean:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Assert exact main
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "main advanced after this run started"
          }

      - name: Correct obsolete temporary selectors
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/task36_phase3_apply.py")
          text = path.read_text(encoding="utf-8")
          label = '        label="search test migration call",'
          if text.count(label) != 1:
              raise SystemExit(f"expected one obsolete selector label, found {text.count(label)}")
          label_index = text.index(label)
          start = text.rfind("    text = replace(", 0, label_index)
          end = text.index("    )", label_index) + len("    )")
          new = (
              '    text = replace(\n'
              '        text,\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_all_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        label="search test setup migration authority",\n'
              '    )'
          )
          path.write_text(text[:start] + new + text[end:], encoding="utf-8", newline="\n")

          final_path = Path("scripts/task36_phase3_final_fix.py")
          final_text = final_path.read_text(encoding="utf-8")
          old = "".join([
              "    text = replace_once(\n", "        text,\n",
              "        '''            let mut c = open_file_connection(&path).unwrap();\n",
              "            run_migrations(&mut c).unwrap();''',\n",
              "        '''            let mut c = open_file_connection(&path).unwrap();\n",
              "            crate::infrastructure::sqlite::task36_migration::run_all_migrations(&mut c)\n",
              "                .unwrap();''',\n",
              '        "narrative reopen migration authority",\n', "    )",
          ])
          replacement = "".join([
              "    text = replace_once(\n", "        text,\n",
              "        '''        // ── Session 3: verify restored state ─────────────────────────────────\n",
              "        {\n", "            let mut c = open_file_connection(&path).unwrap();\n",
              "            run_migrations(&mut c).unwrap();''',\n",
              "        '''        // ── Session 3: verify restored state ─────────────────────────────────\n",
              "        {\n", "            let mut c = open_file_connection(&path).unwrap();\n",
              "            crate::infrastructure::sqlite::task36_migration::run_all_migrations(&mut c)\n",
              "                .unwrap();''',\n",
              '        "narrative reopen migration authority",\n', "    )",
          ])
          if final_text.count(old) != 1:
              raise SystemExit(f"expected one narrative selector block, found {final_text.count(old)}")
          final_path.write_text(final_text.replace(old, replacement), encoding="utf-8", newline="\n")
          '@ | python -

      - name: Apply already-verified backend patches
        shell: pwsh
        run: |
          python scripts/task36_phase3_apply.py
          python scripts/task36_migration20_scope_fix.py
          python scripts/task36_phase3_final_fix.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Enforce Task 37 exclusion
        shell: pwsh
        run: |
          $leaks = git grep -n -E "focus_plan_id" -- src-tauri/src/task src-tauri/src/infrastructure/sqlite/migrations.rs
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $leaks | ForEach-Object { Write-Host "::error::$_" }
            throw "Task 37 relation leaked into Task 36"
          }
          if ($code -ne 1) { throw "Task 37 exclusion scan failed" }
          $sql = Get-Content src-tauri/src/infrastructure/sqlite/task36_migration.rs -Raw
          if ($sql -match "ALTER TABLE (tasks|task_series)" -or $sql -match "REFERENCES (tasks|task_series)") {
            throw "Task 37 SQL leaked into migration 20"
          }
          exit 0

      - name: Remove all temporary Task 36 scaffolding
        shell: pwsh
        run: |
          $paths = @(
            ".github/workflows/task36-verification.yml",
            "scripts/task36_phase3_apply.py",
            "scripts/task36_migration20_scope_fix.py",
            "scripts/task36_phase3_final_fix.py",
            ".gitkeep-temp",
            "specs/026-focus-plans-core/.phase1-compiler-findings.md",
            "specs/026-focus-plans-core/compiler-boundary.md",
            "specs/026-focus-plans-core/phase1-exact-byte-policy.md",
            "specs/026-focus-plans-core/phase-1-evidence.md",
            "docs/audits/task-36-phase-1-compiler.md"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { git rm -f -- $path }
          }

      - name: Commit integrated backend and cleanup
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "main advanced before integration commit"
          }
          git add src-tauri
          git diff --cached --check
          if (git diff --cached --quiet) { throw "integration produced no changes" }
          git config user.name "Kieran Lucas"
          git config user.email "kieranlucas.work@gmail.com"
          git commit -m "integrate task 36 search backup and remove temporary scaffolding [skip ci]"
          git push origin HEAD:main
