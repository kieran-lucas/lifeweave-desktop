name: Task 36 verification

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "frontend/**"
      - "e2e-tests/**"
      - "scripts/**"
      - "specs/026-focus-plans-core/**"
      - "docs/PROJECT_STATE.json"
      - "docs/STATUS.md"
      - "docs/ROADMAP.md"
      - "START_HERE.md"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/task36-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Source integrity
        run: pnpm source:verify
      - name: Repository governance
        run: pnpm governance:check
      - name: Generated indexes
        run: pnpm index:check
      - name: Security and hardening
        run: pnpm verify
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm --dir frontend exec vitest run --maxWorkers=4
      - name: Frontend production build
        run: pnpm build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
