[package]
name = "lifeweave-desktop"
version = "0.0.0"
description = "Windows local-first Task System + Life System"
authors = ["Lifeweave contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "lifeweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.2", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
