name: One-time Task 36 materialization

on:
  push:
    branches: [workflow-cleanup-materialize]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize Task 36 source fixes
        run: |
          python scripts/task36_remediation.py
          python scripts/task36_revision_contract.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify focused source
        run: |
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          git diff --exit-code -- frontend/src/ipc/generated
          git diff --check

      - name: Stage materialized source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact/frontend/src/features/focus-plan | Out-Null
          New-Item -ItemType Directory -Force artifact/src-tauri/src/focus_plan | Out-Null
          Copy-Item frontend/src/features/focus-plan/FocusPlansScreen.tsx artifact/frontend/src/features/focus-plan/
          Copy-Item frontend/src/features/focus-plan/FocusPlansScreen.test.tsx artifact/frontend/src/features/focus-plan/
          Copy-Item src-tauri/src/focus_plan/dto.rs artifact/src-tauri/src/focus_plan/
          Copy-Item src-tauri/src/focus_plan/repository.rs artifact/src-tauri/src/focus_plan/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task36-materialized-source
          path: artifact/**
          if-no-files-found: error
          retention-days: 1
