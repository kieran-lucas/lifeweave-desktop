name: Rust

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup-phase notice
        if: ${{ hashFiles('src-tauri/Cargo.lock') == '' }}
        shell: pwsh
        run: Write-Host "Cargo.lock is not present; run Windows bootstrap before making this check required."
      - name: Install Rust
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Check
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Format
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
