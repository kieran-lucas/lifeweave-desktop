name: Temporary redesign verification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Source integrity
        run: pnpm source:verify

      - name: Project-state governance
        run: python scripts/check_project_state.py

      - name: Generated indexes
        run: pnpm index:check

      - name: Asset, security, and hardening verification
        run: |
          python scripts/verify_no_remote_assets.py
          python scripts/verify_security.py
          python scripts/verify_hardening.py
