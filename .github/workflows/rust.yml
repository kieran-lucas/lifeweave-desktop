name: Rust

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup-phase notice
        if: ${{ hashFiles('src-tauri/Cargo.lock') == '' }}
        shell: pwsh
        run: Write-Host "Cargo.lock is not present; run Windows bootstrap before making this check required."
      - name: Install Rust
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
