[package]
name = "lifeweave-desktop"
version = "1.0.0"
description = "Windows local-first Task System + Life System"
authors = ["Lifeweave contributors"]
edition = "2024"
rust-version = "1.88"

[features]
e2e-test = []

[lib]
name = "lifeweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Stage C: dedicated SQLite worker. Bundled to avoid Windows system-SQLite version
# inconsistency; version-controlled SQLite build; consistent PRAGMA behavior.
# Alternatives: system SQLite (version drift risk), sqlx (async overhead not warranted
# for a single writer). License: MIT. Bundle impact: ~0.8 MB binary increase.
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
# Stage D: stable record IDs. UUIDv7 chosen over v4 because monotonic sort-order
# makes pagination and debugging deterministic; over SQLite randomblob because the
# ID is generated on the application side before INSERT, which makes testing and
# tracing easier. License: Apache-2.0 OR MIT. Zero transitive deps beyond getrandom.
uuid = { version = "1", features = ["v7"] }
# Stage E: SHA-256 checksums for backup manifests. Apache-2.0/MIT dual license,
# zero non-digest transitive deps, no network. Alternative blake3 is faster but
# sha2 is more universally recognized for file-integrity use.
sha2 = "0.10"
# Vietnamese-normalized global search. NFKD decomposition + combining-mark strip + đ→d mapping.
# Exact-pinned so normalization output is deterministic across builds.
unicode-normalization = "=0.1.25"
# CommonMark parser for the shared Basic Leaf/Narrative Markdown authority (MIT license).
# GFM tables/task markers are enabled explicitly by the adapter; HTML remains rejected. Exact pin
# keeps event semantics durable; replaces four shipped JS parser/stringifier dependencies.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# Task recurrence is parsed and expanded in Rust using the RFC 5545 engine
# locked by the product specification. Both versions are exact-pinned so the
# local-date projection cannot drift with a transitive update.
rrule = "=0.14.0"
chrono = "=0.4.45"
# Basic Leaf verifies and metadata-strips local image exports by decoding and
# re-encoding only the four Core formats. Exact-pinned and default formats are
# disabled to avoid bringing unrelated codecs into the native binary.
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Task 31: bounded document-level portable ZIP.
# Exact-pinned because the package is a durable interchange format.
# Default features are disabled: v1 admits Stored entries only, with no encryption
# or compression codec. zip 5.1.1 MSRV 1.83 is compatible with project Rust 1.85.
# Alternatives rejected: dialog/fs plugins broaden capability; JSON/Base64 inflates
# IPC; hand-written ZIP is unsafe and unnecessary. MIT license; no runtime network.
zip = { version = "=5.1.1", default-features = false }

# Directory-metadata durability barrier for the restore swap sequence (Finding F6).
# windows-sys is already a transitive dependency through tauri v2.11.2; adding as a
# direct target-gated dependency to call FlushFileBuffers on parent directory handles
# without raw extern declarations. Zero additional binary weight on Windows; absent on
# other targets.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
ts-rs = { version = "10", features = ["serde-compat"] }

[lints.clippy]
# Rust 1.95 promoted these two mechanical style suggestions into warnings. Rewriting every
# historical conditional would create a broad, behavior-neutral release diff; keep the strict gate
# for correctness lints while handling these styles in a future dedicated cleanup.
collapsible_if = "allow"
manual_is_multiple_of = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
