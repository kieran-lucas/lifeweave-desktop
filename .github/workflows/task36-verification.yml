name: Task 36 Phase 3 integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/task36-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task36-phase3-integration
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Assert exact main authority
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "main advanced after this Phase 3 run started"
          }
      - name: Correct bounded patch selector in runner
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/task36_phase3_apply.py")
          text = path.read_text(encoding="utf-8")
          label = '        label="search test migration call",'
          if text.count(label) != 1:
              raise SystemExit(f"expected one obsolete selector label, found {text.count(label)}")
          label_index = text.index(label)
          start = text.rfind("    text = replace(", 0, label_index)
          end = text.index("    )", label_index) + len("    )")
          if start < 0 or end <= label_index:
              raise SystemExit("could not isolate obsolete search selector block")
          new = (
              '    text = replace(\n'
              '        text,\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        "    fn setup() -> Connection {\\n        let mut conn = open_memory_connection().unwrap();\\n        run_all_migrations(&mut conn).unwrap();\\n        conn\\n    }",\n'
              '        label="search test setup migration authority",\n'
              '    )'
          )
          path.write_text(text[:start] + new + text[end:], encoding="utf-8", newline="\n")
          '@ | python -
      - name: Apply bounded Phase 3 patch
        run: python scripts/task36_phase3_apply.py
      - name: Preserve historical Search triggers during migration 20
        run: python scripts/task36_migration20_scope_fix.py
      - name: Expand Search entity authority and current schema assertions
        run: python scripts/task36_phase3_final_fix.py
      - name: Enforce Task 37 prohibition
        shell: pwsh
        run: |
          $leaks = git grep -n -E "focus_plan_id" -- src-tauri/src/task src-tauri/src/infrastructure/sqlite/migrations.rs
          $grepCode = $LASTEXITCODE
          if ($grepCode -eq 0) {
            $leaks | ForEach-Object { Write-Host "::error::$_" }
            throw "Task 37 relation leaked into Task 36"
          }
          if ($grepCode -ne 1) {
            throw "Task 37 leak scan failed with exit code $grepCode"
          }

          $sql = Get-Content src-tauri/src/infrastructure/sqlite/task36_migration.rs -Raw
          if ($sql -match "ALTER TABLE (tasks|task_series)" -or $sql -match "REFERENCES (tasks|task_series)") {
            throw "Task 37 SQL leaked into migration 20"
          }
          exit 0
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Compile all Rust targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path task36-phase3-evidence | Out-Null
          $output = cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath task36-phase3-evidence/cargo-check.log | ForEach-Object { Write-Host $_ }
          exit $code
      - name: Clippy with warnings denied
        shell: pwsh
        run: |
          $output = cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath task36-phase3-evidence/cargo-clippy.log | ForEach-Object { Write-Host $_ }
          exit $code
      - name: Run focused Phase 3 regressions
        shell: pwsh
        run: |
          $filters = @(
            "migration_20_expands_search_entity_kind_and_preserves_fts",
            "migration_20_preserves_old_dirty_triggers_and_adds_focus_plan_scope",
            "rebuild_indexes_plan_context_without_reader_rows",
            "archived_plan_is_removed_from_search_projection",
            "schema_9_backup_restores_and_migrates_with_its_basic_leaf_asset",
            "round_trip_restore_recovers_exact_data",
            "narrative_canvas_backup_relaunch_evidence"
          )
          foreach ($filter in $filters) {
            cargo test --manifest-path src-tauri/Cargo.toml --locked $filter -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run all Rust tests
        shell: pwsh
        run: |
          $output = cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath task36-phase3-evidence/cargo-test.log | ForEach-Object { Write-Host $_ }
          exit $code
      - name: Record bounded Phase 3 diff
        shell: pwsh
        run: |
          git diff --check
          git diff -- src-tauri | Out-File task36-phase3-evidence/phase3.patch -Encoding utf8
          git status --short | Out-File task36-phase3-evidence/status.txt -Encoding utf8
      - name: Upload Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: task36-phase3-evidence
          path: task36-phase3-evidence
          if-no-files-found: warn
      - name: Commit only after every Phase 3 gate passes
        shell: pwsh
        run: |
          git config user.name "Kieran Lucas"
          git config user.email "kieranlucas.work@gmail.com"
          git add src-tauri/src/focus_plan/repository.rs `
                  src-tauri/src/infrastructure/backup/lifecycle.rs `
                  src-tauri/src/infrastructure/backup/restore.rs `
                  src-tauri/src/infrastructure/sqlite/task36_migration.rs `
                  src-tauri/src/narrative/repository.rs `
                  src-tauri/src/search `
                  src-tauri/src/tag/repository.rs
          if (git diff --cached --quiet) { throw "Phase 3 produced no staged changes" }
          git commit -m "integrate task 36 tags search and backup [skip ci]"
          git push origin HEAD:main
